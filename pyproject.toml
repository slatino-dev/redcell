[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcell"
version = "0.0.0"
description = "Defensive agent-security test harness for authorized red-teaming of your own agents, organized around the OWASP Top 10 for Agentic Applications (2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Latino", email = "Latinosammy2@gmail.com" }]
keywords = [
    "agent-security",
    "owasp",
    "red-team",
    "ai-safety",
    "evaluation",
    "test-harness",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
redcell = "redcell.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["redcell"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["targets", "corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["redcell", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
